<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>CollectUS</title>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap' rel='stylesheet'>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 2rem;
      line-height: 1.5;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      font-weight: 600;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>CollectUS</h1>
  <p id='count'>Loading count...</p>

  <table id='data-table'>
    <thead>
      <tr>
        <th>ID</th>
        <th>Surname</th>
        <th>Name</th>
        <th>URL</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan='4'>Loading...</td>
      </tr>
    </tbody>
  </table>

  <script>
    const url = 'https://raw.githubusercontent.com/amoraschi/CollectUS/master/data.csv'

    fetch(url)
      .then(res => res.text())
      .then(text => {
        const rows = text.trim().split('\n').slice(1)
        const tbody = document.querySelector('#data-table tbody')
        const countEl = document.getElementById('count')
        tbody.innerHTML = ''

        rows.forEach(row => {
          const [id, surname, name, link] = row.split(';')
          const tr = document.createElement('tr')
          tr.innerHTML = `
            <td>${id}</td>
            <td>${surname}</td>
            <td>${name}</td>
            <td><a href='${link}' target='_blank'>${link}</a></td>
          `
          tbody.appendChild(tr)
        })

        countEl.innerHTML = `<strong>${rows.length}</strong> Entries`
      })
      .catch(err => console.error('Error fetching CSV:', err))
  </script>
</body>
</html>
